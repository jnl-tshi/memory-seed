[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-seed"
version = "2.22.0"
description = "Portable local memory seed for file-reading AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["model2vec>=0.8.1"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean Nathan Tshibuyi" }]
keywords = ["ai", "agents", "memory", "markdown", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.scripts]
memory-seed = "memory_seed.cli:main"
memory-seed-mcp = "memory_seed.mcp_server:main"
memory-seed-mcp-validate = "memory_seed.mcp_validate:main"
memory-trace = "memory_trace.cli:main"

[project.optional-dependencies]
# Optional review UI dependencies. Plain `pip install memory-seed` stays
# web-framework-free; `pip install "memory-seed[trace]"` enables the local
# Memory Trace browser UI and the `memory-trace` command.
trace = ["fastapi>=0.110", "uvicorn>=0.27"]
# Test-only. `pytest -n auto` parallelizes the suite across worker processes -
# measured 10:15 -> 4:07 wall-clock on 16 cores (1412 tests, mostly independent
# git-subprocess/tempdir integration tests, no single pathological test
# dominates runtime so distributing them beats optimizing any one of them).
dev = ["pytest", "pytest-xdist"]

[tool.setuptools]
packages = ["memory_seed", "memory_trace"]

[tool.setuptools.package-dir]
memory_trace = "memory-trace/memory_trace"

[tool.pytest.ini_options]
# Pytest's cacheprovider can hang on shutdown in Windows OneDrive worktrees
# after tests pass. Keep validation deterministic by disabling repo-local cache.
addopts = ["-p", "no:cacheprovider"]
# `memory-trace/` is a source root, not an installed package, so a bare `pytest`
# from the repo root failed to collect its 23 test modules with "No module named
# 'memory_trace'". CI runs that suite through `unittest discover` with the package
# importable, so CI saw failures a local run structurally could not - three of them
# sat on main from 2026-07-28 until the next push surfaced them. One line here means
# `pytest` from the root runs what CI runs.
pythonpath = ["memory-trace"]
# Product verification is deliberately bounded. Frozen research instruments and
# captured subject artifacts are runnable by explicit path, but must not make a
# bare `pytest` collect duplicate test-module names from archival copies.
testpaths = ["tests", "memory-trace/tests"]
markers = [
  "integration: spawns real git subprocesses across a multi-step workflow (>=0.5s measured); run the fast loop with `pytest -m \"not integration\"`, full suite (default `pytest`) still runs everything.",
]

