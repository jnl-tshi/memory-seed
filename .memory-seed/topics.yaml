    # `session-authoring` is kept as a spelling variant: "entry authoring" is this slug's own
    # first clause, so it names the same concept.
    # `append-only` is FLAGGED AS WRONG and deliberately left where it is. It is a cross-cutting
    # INVARIANT, not an area or an activity, so it fails the axis test - promoting it here would
    # make it inherit `area` from session logging. Worse, its one authored use ("Constraint:
    # evolved_by is read-time inferred only, never stored") is about the GRAPH, not session
    # logging, so today it resolves to a slug that entry is not about. Re-pointing it at `graph`
    # would be just as arbitrary, since the append-only model governs all three sidecar families.
    # It stays resolvable so the entry stays valid, and stays flagged so the fix is deliberate.
    aliases: [session-authoring, append-only]
