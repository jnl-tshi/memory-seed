participants:
  - slug: jean
    initials: JNL
    display_name: Jean Nathan Tshibuyi

# Verified local integrations may land without a per-merge prompt. Agents still
# use the session fuse and stop on validation failures or unresolved conflicts.
merge_trigger: automatic

# Optional local-only Graphify index refresh after a successful session merge.
# Failure warns and leaves the merge committed; no LLM or network service is used.
graphify_merge_refresh: true

# Docs lifecycle paths are project-local. The ordered lanes drive both
# `memory-seed docs check` and `memory-seed docs index`. Allowlist entries cover
# folder subtrees, may use POSIX glob segments, and may exempt intentional
# non-lane documentation trees.
docs:
  lanes:
    - 1_Inbox
    - 2_Todo
    - 3_Spec
    - 4_Reference
    - 5_Completed
    - 6_Rejected
    - 7_Replaced
    - 8_Deferred
  allowlist:
    - 3_Spec/deprecated
    - 3_Spec/draft
    - 4_Reference/archived
    - 4_Reference/memory-trace-phase0-baseline
    - 4_Reference/trace-humanised-dashboard-references
    - 5_Completed/agent-templates

# Shared planning policy. Local/task settings may tighten these values only.
delivery_quality:
  schema_version: 1
  constitutional_conflict: stop
  adr_conflict: stop
  individual_decision_conflict: warn
  failed_hypothesis_threshold: 3
  tests_before_behavior_change: true
